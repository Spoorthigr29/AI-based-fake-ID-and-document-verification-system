{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password | VerifyX AI{% endblock %}

{% block content %}
<div class="container py-5 d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 200px);">
    <div class="glass-card p-4 p-sm-5" style="max-width: 480px; width: 100%;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-info bg-opacity-10 border border-info border-opacity-25 mb-3" style="width: 58px; height: 58px;">
                <i class="fa-solid fa-key text-info fs-3"></i>
            </div>
            <h3 class="fw-bold text-white mb-1">Reset Password</h3>
            <p class="text-muted small mb-0">Enter your registered email address to receive password recovery assistance.</p>
        </div>

        <form method="POST" action="{% url 'accounts:forgot_password' %}">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label text-light small fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-info"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control bg-dark text-white border-secondary" placeholder="admin@verifyx.ai" required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-cyber-primary py-2 fw-semibold">
                    <i class="fa-solid fa-paper-plane me-2"></i> Send Recovery Instructions
                </button>
            </div>
        </form>

        <div class="text-center pt-3 border-top border-secondary border-opacity-25">
            <a href="{% url 'accounts:login' %}" class="small text-info text-decoration-none fw-semibold">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
